name: ci

# Analysis, tests on both PHP versions, Cypress and the Docker build run as separate jobs in
# parallel. A newer push to the same branch cancels the run that is still going; changes to docs
# only do not start one.
on:
  pull_request:
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Static analysis and audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Cache config, routes, events and Blade views
        run: php artisan optimize

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: php -d memory_limit=-1 vendor/bin/phpstan analyse --no-progress

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: ESLint and Stylelint
        run: |
          npm ci
          npm run lint

      - name: Composer audit (production dependencies)
        run: composer audit --no-dev

      - name: npm audit (all dependencies, the server installs them to build)
        run: npm audit

  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit (Unit + Feature)
        run: vendor/bin/phpunit --testdox

  cypress:
    name: Cypress
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ hashFiles('package-lock.json') }}

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment and database
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force

      - name: Start the app
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/up > /dev/null && exit 0
            sleep 1
          done
          cat storage/logs/serve.log
          exit 1

      - name: Run Cypress
        run: npx cypress run

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  build:
    name: Build and start
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t happynotes .

      - name: Start container
        run: docker run -d --name happynotes -p 8080:80 happynotes

      - name: Check that the app responds
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/up > /dev/null && curl -fs http://localhost:8080/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs happynotes
          exit 1

  # A minor or patch update from Dependabot is merged once every job above is green, a major one
  # stays open for review. Private repositories cannot require status checks on a free account,
  # so all apps wait for the jobs like this instead of relying on a ruleset.
  automerge:
    name: Merge Dependabot minor and patch updates
    needs: [analyse, phpunit, cypress, build]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Read update type
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
